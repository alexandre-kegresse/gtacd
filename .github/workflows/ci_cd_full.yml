name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run application check script
        run: ./app/check_app.sh

      - name: Display index.html content
        run: cat app/index.html

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Deploiement distant desactive par defaut.
    # La VM cible se trouve sur le reseau local de l'ecole, derriere le
    # portail captif Alcasar : un runner GitHub public ne peut pas la joindre.
    # Pour activer : creer la variable de depot REMOTE_DEPLOY = true
    # (Settings > Secrets and variables > Actions > Variables).
    if: vars.REMOTE_DEPLOY == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Ansible
        run: pip install ansible

      - name: Create Ansible inventory file
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "[webservers]" > inventory.ini
          echo "$SERVER_IP ansible_user=$SERVER_USER ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          chmod 600 inventory.ini

      - name: Run Ansible Playbook
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ansible-playbook -i inventory.ini ansible/deploy.yml